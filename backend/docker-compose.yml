name: off-the-record

services:
  db:
    image: mysql:8.0
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: off_the_record
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - otr_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prootpass"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local  # local 프로필이어야 import 동작 :contentReference[oaicite:2]{index=2}

      # application-local.yml이 이걸 읽음 :contentReference[oaicite:3]{index=3}
      OFF_THE_RECORD_DB_URL: jdbc:mysql://db:3306/off_the_record?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      OFF_THE_RECORD_DB_USERNAME: app
      OFF_THE_RECORD_DB_PASSWORD: apppass

volumes:
  otr_mysql:
