name: off-the-record

services:
  db:
    image: mysql:8.0
    environment:
      TZ: Asia/Seoul
      MYSQL_DATABASE: off_the_record
      MYSQL_USER: app
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - otr_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local

      # application-local.yml이 이걸 읽음
      OFF_THE_RECORD_DB_URL: ${OFF_THE_RECORD_DB_URL}
      OFF_THE_RECORD_DB_USERNAME: ${OFF_THE_RECORD_DB_USERNAME}
      OFF_THE_RECORD_DB_PASSWORD: ${OFF_THE_RECORD_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

volumes:
  otr_mysql:
