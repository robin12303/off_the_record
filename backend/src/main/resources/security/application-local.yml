server:
  port: 8080
  shutdown: immediate

spring:
  datasource:
    url: ${OFF_THE_RECORD_DB_URL}
    username: ${OFF_THE_RECORD_DB_USERNAME}
    password: ${OFF_THE_RECORD_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origin-patterns: "http://localhost:*"
        allowed-methods: "GET,OPTIONS"
        allowed-headers: "*"

app:
  jwt:
    secret: ${JWT_SECRET}
    accessTtlSeconds: 900
  refresh:
    ttlSeconds: 1209600
