name: agent-v1-ci

on:
  push:
    paths:
      - "agent_v1/**"
      - ".github/workflows/agent_v1_ci.yml"
  pull_request:
    paths:
      - "agent_v1/**"

jobs:
  windows-msbuild:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Ensure vcpkg exists + bootstrap
        shell: powershell
        run: |
          if (!(Test-Path "extern/vcpkg/bootstrap-vcpkg.bat")) {
            New-Item -ItemType Directory -Force -Path extern | Out-Null
            git clone --depth 1 https://github.com/microsoft/vcpkg extern/vcpkg
          }
          cmd /c extern\\vcpkg\\bootstrap-vcpkg.bat

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            extern/vcpkg/downloads
            extern/vcpkg/installed
            extern/vcpkg/packages
          key: vcpkg-${{ runner.os }}-x64-windows-boostjson-beast

      - name: Install Boost deps via vcpkg
        shell: powershell
        run: |
          .\\extern\\vcpkg\\vcpkg.exe install boost-json boost-beast --triplet x64-windows

      - name: Build (MSBuild vcxproj)
        shell: powershell
        run: |
          msbuild agent_v1\agent_v1\agent_v1.vcxproj `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:VcpkgEnabled=true `
            /p:VcpkgTriplet=x64-windows `
            /p:VcpkgRoot="${{ github.workspace }}\extern\vcpkg"

  