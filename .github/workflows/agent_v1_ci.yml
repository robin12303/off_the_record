name: agent-ci

on:
  push:
    paths:
      - "agent_v1/**"
      - ".github/workflows/agent_ci.yml"
  pull_request:
    paths:
      - "agent_v1/**"

jobs:
  windows-msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure vcpkg exists + bootstrap
        shell: powershell
        run: |
          if (!(Test-Path "extern/vcpkg/bootstrap-vcpkg.bat")) {
            New-Item -ItemType Directory -Force -Path extern | Out-Null
            git clone --depth 1 https://github.com/microsoft/vcpkg extern/vcpkg
          }
          cmd /c extern\\vcpkg\\bootstrap-vcpkg.bat

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            extern/vcpkg/downloads
            extern/vcpkg/installed
            extern/vcpkg/packages
          key: vcpkg-${{ runner.os }}-${{ hashFiles('agent_v1/agent_v1/vcpkg.json') }}

      - name: Configure (CMake preset)
        shell: powershell
        working-directory: agent_v1/agent_v1
        run: cmake --preset ci-msvc

      - name: Build (CMake preset)
        shell: powershell
        working-directory: agent_v1/agent_v1
        run: cmake --build --preset ci-msvc

      - name: Test (ctest, if present)
        shell: powershell
        working-directory: agent_v1/agent_v1
        run: ctest --test-dir build/ci-msvc -C Release --output-on-failure
